<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="iconBgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>

    <linearGradient id="hg1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#38e2fc"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="hg2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="hg3" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="hg4" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="hg5" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="hg6" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="hg7" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="hg8" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fde047"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    <linearGradient id="hg9" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="hg10" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient>

    <linearGradient id="deckGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="hShadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="900" height="280" fill="#0d0e15"/>

  <!-- Icon (200x200 placed at X=60, Y=40) -->
  <g transform="translate(60, 40)">
    <rect x="8" y="16" width="184" height="184" rx="44" ry="44"
          fill="#000000" opacity="0.6" filter="url(#hShadowBlur)"/>
    <rect x="8" y="8" width="184" height="184" rx="44" ry="44"
          fill="url(#iconBgGradH)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2.2"/>
    <g transform="scale(0.78125)">
      <rect x="32" y="36" width="16" height="184" rx="5" ry="5" fill="url(#hg1)"/>
      <rect x="54" y="46" width="9" height="164" rx="4.5" ry="4.5" fill="url(#hg2)"/>
      <rect x="68" y="46" width="22" height="164" rx="5" ry="5" fill="url(#hg3)"/>
      <rect x="95" y="46" width="11" height="164" rx="5" ry="5" fill="url(#hg4)"/>
      <rect x="111" y="36" width="15" height="184" rx="5" ry="5" fill="url(#hg5)"/>
      <rect x="131" y="46" width="25" height="164" rx="5" ry="5" fill="url(#hg6)"/>
      <rect x="161" y="46" width="9" height="164" rx="4.5" ry="4.5" fill="url(#hg7)"/>
      <rect x="175" y="46" width="17" height="164" rx="5" ry="5" fill="url(#hg8)"/>
      <rect x="197" y="46" width="10" height="164" rx="5" ry="5" fill="url(#hg9)"/>
      <rect x="212" y="36" width="16" height="184" rx="5" ry="5" fill="url(#hg10)"/>
    </g>
  </g>

  <!-- Typography to the Right -->
  <g transform="translate(300, 140)">
    <text x="0" y="0"
          font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif"
          font-size="74" font-weight="400" letter-spacing="-1.5px">
      <tspan fill="#F8FAFC" font-weight="400">gutter</tspan><tspan fill="url(#deckGradH)" font-weight="800">Deck</tspan>
    </text>
    <text x="4" y="48"
          font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif"
          font-size="13" font-weight="700" letter-spacing="8px" fill="#94A3B8">
      DESKTOP COMPOSITOR DOCK
    </text>
  </g>
</svg>
